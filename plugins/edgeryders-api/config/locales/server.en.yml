en:
  site_settings:
    edgeryders_api_enabled: "Enable edgeryders-api plugin"

  user_notifications:
    edgeryders_api_account_created:
      title: "Account Created"
      subject_template: "[%{email_prefix}] Your New Account"
      text_body_template: |
        Welcome to Edgeryders,

        a new account was created for you at https://edgeryders.eu

        Login Information:
        - Username: %{username}
        - Email: %{email}

        Please use either your username or email, along with your password, to log in to your account.
